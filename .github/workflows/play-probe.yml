# Temporary: can a GitHub-hosted runner download an old YouTube build from Play anonymously?
name: Play probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q goopdl
      - run: |
          for vc in 1561304941 1561301413; do
            goopdl inspect-delivery com.google.android.youtube -v $vc 2>&1 | tail -6
          done
      - run: |
          mkdir out && goopdl download com.google.android.youtube -v 1561301413 -o out >/dev/null 2>&1; ls -la out
